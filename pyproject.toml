[project]
name = "llm-fallback"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "morch1", email = "70644384+morch1@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
